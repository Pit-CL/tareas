# Copy this file to ~/.config/tareas/config.toml and adjust the values.
# The app resolves the Project's internal identifiers on its own and caches
# them in ~/.config/tareas/ids-cache.json, so nothing opaque goes here.

# GitHub user or organization that owns the Project (v2).
owner = "my-user"

# Project number; it's the one at the end of its URL.
# https://github.com/users/my-user/projects/1  ->  1
project = 1

# Name of the Date-type field that marks the due date.
campo_fecha = "Due date"

# Name of the Status option that counts as done.
estado_hecho = "Done"
